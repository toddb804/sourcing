<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listing Cam">
<meta name="theme-color" content="#000000">
<title>Listing Cam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#000; --panel:#0E0E10; --card:#17171A; --card2:#1E1E22; --line:#2A2A30;
  --text:#F2F2F3; --muted:#A0A0A8; --faint:#6E6E78;
  --orange:#CC5500; --orange-hi:#E2670F; --good:#4CC38A; --warn:#F5B14C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.num{font-variant-numeric:tabular-nums}
#app{height:100dvh;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--bg)}
.top .sp{flex:1}
.pill{height:32px;padding:0 12px;border-radius:99px;background:var(--card);color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.3px}
.pill.on{color:var(--orange-hi);background:rgba(204,85,0,.16)}
.tag{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--faint);text-transform:uppercase}

/* stage */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;touch-action:none}
#view{position:absolute;left:0;top:0}
#overlay{position:absolute;pointer-events:none}
#grid{position:absolute;inset:0;display:none;
  background:
    linear-gradient(to right,transparent calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% + .5px),transparent calc(33.333% + .5px),
      transparent calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% + .5px),transparent calc(66.666% + .5px)),
    linear-gradient(to bottom,transparent calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% + .5px),transparent calc(33.333% + .5px),
      transparent calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% + .5px),transparent calc(66.666% + .5px))}
#grid.show{display:block}
#gridBox{position:absolute}
.mask{position:absolute;background:rgba(0,0,0,.6)}
#reticle{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:1.5px solid var(--orange-hi);border-radius:6px;
  opacity:0;transform:scale(1.25);transition:opacity .2s,transform .2s;pointer-events:none}
#reticle.show{opacity:1;transform:scale(1)}
#reticle.gray{border-radius:50%;border-color:#fff;width:44px;height:44px;margin:-22px 0 0 -22px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#toast{position:absolute;left:16px;right:16px;bottom:14px;margin:auto;max-width:440px;background:rgba(14,14,16,.92);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.35;color:var(--text);opacity:0;transform:translateY(8px);
  transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:none}
#pickHint{position:absolute;top:12px;left:0;right:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--orange);color:#fff;
  font-weight:700;font-size:14px;border-radius:99px;padding:8px 16px;display:none;pointer-events:none}
#pickHint.show{display:block}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#start h1{margin:0;font-size:26px;font-weight:800}
#start p{margin:0;color:var(--muted);max-width:320px;line-height:1.4}
.btn{height:48px;padding:0 22px;border-radius:14px;background:var(--orange);color:#fff;font-weight:800;font-size:16px}
.btn.ghost{background:var(--card);color:var(--text)}

/* controls */
.controls{background:var(--panel);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctl{background:var(--card);border-radius:12px;padding:7px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent}
.ctl small{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--faint)}
.ctl b{font-size:15px;font-weight:800}
.ctl.sel{border-color:var(--orange)}
.ctl.active b{color:var(--orange-hi)}
.ctl.set b{color:var(--good)}

.panel{margin-top:10px}
.panel[hidden]{display:none}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;color:var(--muted)}
.phead b{color:var(--text);font-size:20px;font-weight:800}
.phead .sbtn{height:30px;padding:0 12px;border-radius:99px;background:var(--card);font-size:13px;font-weight:700;color:var(--text)}
.dial{position:relative;height:46px;border-radius:12px;background:var(--card);overflow:hidden;touch-action:none;cursor:ew-resize}
.dial .ticks{position:absolute;inset:0}
.dial .needle{position:absolute;left:50%;top:4px;bottom:4px;width:3px;margin-left:-1.5px;background:var(--orange-hi);border-radius:2px}
.dial .fade{position:absolute;inset:0;background:linear-gradient(to right,var(--card),transparent 22%,transparent 78%,var(--card));pointer-events:none}
.presets{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;height:30px;padding:0 10px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:700;color:var(--muted)}
.gray-row{display:flex;gap:8px;align-items:center}
.gray-row p{flex:1;margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.swatch{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);flex:none}

.shutter-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:12px}
#thumb{width:52px;height:52px;border-radius:10px;background:var(--card) center/cover no-repeat;border:2px solid var(--line);position:relative}
#thumb .n{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;padding:0 5px}
#shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
#shutter i{width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .1s}
#shutter:active i{transform:scale(.9)}
#shutter.save i{background:var(--orange)}
.side-r{justify-self:end;display:flex;gap:8px}
.sq{height:52px;min-width:52px;padding:0 10px;border-radius:12px;background:var(--card);font-size:12px;font-weight:700;color:var(--muted);display:grid;place-items:center;text-align:center;line-height:1.15}

/* gallery sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:10}
#sheet[hidden]{display:none}
.sheet-in{width:100%;max-height:85dvh;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head b{font-size:18px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow-y:auto;min-height:0}
.gal button{aspect-ratio:1;background:var(--card) center/cover no-repeat;border-radius:8px}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.sheet-actions .btn{flex:1}
.empty{color:var(--muted);padding:24px 0;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button id="bGrid" class="pill">Grid</button>
    <button id="bCrop" class="pill">4:3</button>
    <span class="sp"></span>
    <span id="modeTag" class="tag"></span>
  </div>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="overlay"><div id="gridBox"><div id="grid"></div></div><div class="mask" id="m1"></div><div class="mask" id="m2"></div></div>
    <div id="reticle"></div>
    <div id="flash"></div>
    <div id="pickHint">Tap the gray card</div>
    <div id="toast"></div>
    <div id="start">
      <h1>Listing Cam</h1>
      <p>Autofocus, a Kelvin dial and gray-card color for consistent listing photos.</p>
      <button class="btn" id="bStart">Start camera</button>
      <p id="startErr" style="color:var(--warn)"></p>
    </div>
  </div>

  <div class="controls">
    <div class="chips">
      <button class="ctl" id="cAF"><small>FOCUS</small><b id="vAF">AUTO</b></button>
      <button class="ctl" id="cWB"><small>WHITE BAL</small><b id="vWB" class="num">AUTO</b></button>
      <button class="ctl" id="cGray"><small>GRAY CARD</small><b id="vGray">OFF</b></button>
      <button class="ctl" id="cEV"><small>BRIGHT</small><b id="vEV" class="num">0.0</b></button>
    </div>

    <div class="panel" id="pWB" hidden>
      <div class="phead"><span>Kelvin <span id="wbHow"></span></span><b id="wbVal" class="num">AUTO</b><button class="sbtn" id="wbAuto">Auto</button></div>
      <div class="dial" id="dWB"><canvas class="ticks"></canvas><i class="fade"></i><i class="needle"></i></div>
      <div class="presets" id="wbPresets"></div>
    </div>

    <div class="panel" id="pEV" hidden>
      <div class="phead"><span>Brightness (stops)</span><b id="evVal" class="num">0.0</b><button class="sbtn" id="evZero">Reset</button></div>
      <div class="dial" id="dEV"><canvas class="ticks"></canvas><i class="fade"></i><i class="needle"></i></div>
    </div>

    <div class="panel" id="pGray" hidden>
      <div class="gray-row">
        <div class="swatch" id="graySw"></div>
        <p id="grayTxt">Put a gray card in the light you're shooting in, then tap it on screen.</p>
        <button class="sbtn pill" id="grayPick">Tap card</button>
        <button class="sbtn pill" id="grayClear">Clear</button>
      </div>
    </div>

    <div class="shutter-row">
      <button id="thumb" aria-label="Photos"><span class="n" id="thumbN"></span></button>
      <button id="shutter" aria-label="Take photo"><i></i></button>
      <div class="side-r">
        <button class="sq" id="bEdit">Fix a<br>photo</button>
        <button class="sq" id="bDone" style="display:none">Back to<br>camera</button>
      </div>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheet-in">
    <div class="sheet-head"><b id="galTitle">Photos</b><button class="pill" id="galClose">Close</button></div>
    <div class="gal" id="gal"></div>
    <div class="sheet-actions">
      <button class="btn ghost" id="galClear">Clear</button>
      <button class="btn" id="galSave">Save all</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<video id="video" playsinline muted autoplay style="display:none"></video>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const video = $('video'), view = $('view'), stage = $('stage');

/* ---------- settings (remembered on this phone) ---------- */
const S = Object.assign({kelvin:null, gray:null, graySw:null, ev:0, grid:true, crop:'4:3'}, (()=>{
  try{ return JSON.parse(localStorage.getItem('listingcam') || '{}'); }catch(e){ return {}; }
})());
function save(){ try{ localStorage.setItem('listingcam', JSON.stringify(S)); }catch(e){} }

/* ---------- color math (all in linear light) ---------- */
const lin = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
function kelvinRGB(k){            // color of a light source at k Kelvin, linear RGB
  const t = k/100; let r,g,b;
  if (t <= 66){ r = 255; g = 99.4708025861*Math.log(t) - 161.1195681661; }
  else { r = 329.698727446*Math.pow(t-60,-0.1332047592); g = 288.1221695283*Math.pow(t-60,-0.0755148492); }
  if (t >= 66) b = 255; else if (t <= 19) b = 0; else b = 138.5177312231*Math.log(t-10) - 305.0447927307;
  return [r,g,b].map(v => lin(Math.min(255, Math.max(1, v))/255));
}
const REF = kelvinRGB(5500);
// Same meaning as a camera's WB setting: lower K = bluer picture, higher K = warmer.
const kelvinGains = k => { const c = kelvinRGB(k); return [REF[0]/c[0], REF[1]/c[1], REF[2]/c[2]]; };
const normLum = g => { const L = .2126*g[0] + .7152*g[1] + .0722*g[2]; return g.map(v => v/L); };

/* ---------- camera state ---------- */
let stream = null, track = null, caps = {};
let hwWB = false, hwPOI = false, hwFocusModes = [], afLocked = false;
let editSrc = null;                 // canvas holding a photo being fixed
let texDirty = true;

function currentGains(){
  let g = [1,1,1];
  if (S.gray) g = g.map((v,i) => v*S.gray[i]);
  if (S.kelvin && !(hwWB && !editSrc)) { const k = kelvinGains(S.kelvin); g = g.map((v,i) => v*k[i]); }
  g = normLum(g);
  const f = Math.pow(2, S.ev);
  return g.map(v => v*f);
}

/* ---------- WebGL renderer ---------- */
const gl = view.getContext('webgl', {preserveDrawingBuffer:true, alpha:false, antialias:false}) ||
           view.getContext('experimental-webgl', {preserveDrawingBuffer:true});
const MAXTEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision > 0 ? 'highp' : 'mediump';
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER,
  'attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision ${hp} float;
  uniform sampler2D t; uniform vec3 g; varying vec2 uv;
  vec3 toLin(vec3 c){return mix(c/12.92,pow((c+.055)/1.055,vec3(2.4)),step(.04045,c));}
  vec3 toS(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
  void main(){vec3 c=toLin(texture2D(t,uv).rgb)*g;
    float m=max(c.r,max(c.g,c.b)); if(m>1.){c=mix(c,vec3(1.),clamp((m-1.)*1.5,0.,1.));}  // roll clipped highlights to white, not a tint
    gl_FragColor=vec4(toS(clamp(c,0.,1.)),1.);}`));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
const uG = gl.getUniformLocation(prog,'g');
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
[gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(p => gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE));
[gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(p => gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR));

function srcSize(){ return editSrc ? [editSrc.width, editSrc.height] : [video.videoWidth, video.videoHeight]; }
function draw(upload){
  const src = editSrc || video, [w,h] = srcSize();
  if (!w || !h) return false;
  if (view.width !== w || view.height !== h){ view.width = w; view.height = h; layout(); }
  if (upload) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
  gl.viewport(0,0,w,h);
  gl.uniform3fv(uG, currentGains());
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  return true;
}
function loop(){
  if (editSrc){ draw(texDirty); texDirty = false; }
  else if (video.readyState >= 2) draw(true);
  requestAnimationFrame(loop);
}

/* fit the canvas inside the stage and place overlays on the picture area */
let disp = {x:0,y:0,w:0,h:0};
function layout(){
  const sw = stage.clientWidth, sh2 = stage.clientHeight, [w,h] = [view.width, view.height];
  if (!w || !h) return;
  const s = Math.min(sw/w, sh2/h), dw = w*s, dh = h*s;
  disp = {x:(sw-dw)/2, y:(sh2-dh)/2, w:dw, h:dh};
  Object.assign(view.style, {left:disp.x+'px', top:disp.y+'px', width:dw+'px', height:dh+'px'});
  const ov = $('overlay'); Object.assign(ov.style, {left:disp.x+'px', top:disp.y+'px', width:dw+'px', height:dh+'px'});
  const c = cropRect(dw, dh), gb = $('gridBox');
  Object.assign(gb.style, {left:c.x+'px', top:c.y+'px', width:c.w+'px', height:c.h+'px'});
  const m1 = $('m1'), m2 = $('m2');
  if (S.crop === '1:1'){
    if (dw > dh){ Object.assign(m1.style,{left:0,top:0,width:c.x+'px',height:dh+'px'}); Object.assign(m2.style,{left:(c.x+c.w)+'px',top:0,width:c.x+'px',height:dh+'px'}); }
    else { Object.assign(m1.style,{left:0,top:0,width:dw+'px',height:c.y+'px'}); Object.assign(m2.style,{left:0,top:(c.y+c.h)+'px',width:dw+'px',height:c.y+'px'}); }
    m1.style.display = m2.style.display = 'block';
  } else m1.style.display = m2.style.display = 'none';
}
function cropRect(w,h){
  if (S.crop !== '1:1') return {x:0,y:0,w,h};
  const s = Math.min(w,h); return {x:(w-s)/2, y:(h-s)/2, w:s, h:s};
}
window.addEventListener('resize', () => setTimeout(layout, 50));

/* ---------- camera ---------- */
async function startCam(){
  $('startErr').textContent = '';
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{
      facingMode:{ideal:'environment'}, width:{ideal:4032}, height:{ideal:3024}, aspectRatio:{ideal:4/3}}});
  }catch(e){
    $('startErr').textContent = 'Camera blocked. Allow camera access for this page in Settings, then try again.';
    return;
  }
  video.srcObject = stream;
  try{ await video.play(); }catch(e){}
  track = stream.getVideoTracks()[0];
  caps = (track.getCapabilities && track.getCapabilities()) || {};
  hwFocusModes = caps.focusMode || [];
  hwPOI = 'pointsOfInterest' in caps;
  hwWB = !!(caps.colorTemperature && caps.colorTemperature.max > 0 && (caps.whiteBalanceMode||[]).includes('manual'));
  if (hwWB){
    WB.min = Math.max(2000, Math.ceil(caps.colorTemperature.min/50)*50);
    WB.max = Math.min(10000, Math.floor(caps.colorTemperature.max/50)*50);
  }
  $('start').style.display = 'none';
  if (S.kelvin) await setKelvin(S.kelvin); else await setKelvin(null);
  if (hwFocusModes.includes('continuous')) applyAdv({focusMode:'continuous'});
  refresh();
}
async function applyAdv(o){ try{ await track.applyConstraints({advanced:[o]}); return true; }catch(e){ return false; } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && stream && (!track || track.readyState === 'ended')) startCam();
});

/* ---------- white balance ---------- */
async function setKelvin(k){
  S.kelvin = k; save();
  if (hwWB && track){
    if (k) await applyAdv({whiteBalanceMode:'manual', colorTemperature:Math.min(WB.max, Math.max(WB.min, k))});
    else await applyAdv({whiteBalanceMode:'continuous'});
  }
  refresh();
}

/* ---------- focus ---------- */
let toldFocus = false;
async function focusAt(nx, ny, cx, cy){
  showReticle(cx, cy, false);
  if (editSrc || !track) return;
  if (!hwPOI && !hwFocusModes.includes('single-shot')){
    if (!toldFocus){ toast("Autofocus is always on. This phone's browser doesn't allow tap-to-focus, so keep the item centered."); toldFocus = true; }
    return;
  }
  const o = {};
  if (hwPOI) o.pointsOfInterest = [{x:nx, y:ny}];
  o.focusMode = afLocked && hwFocusModes.includes('single-shot') ? 'single-shot'
              : hwFocusModes.includes('continuous') ? 'continuous' : 'single-shot';
  await applyAdv(o);
  if (afLocked && hwFocusModes.includes('manual')) setTimeout(() => applyAdv({focusMode:'manual'}), 900);
}
async function toggleAFLock(){
  if (editSrc) return;
  if (!hwFocusModes.includes('manual')){
    toast("Autofocus stays on. This phone's browser doesn't allow locking focus.");
    return;
  }
  afLocked = !afLocked;
  await applyAdv({focusMode: afLocked ? 'manual' : 'continuous'});
  toast(afLocked ? 'Focus locked. Tap the screen to refocus and lock again.' : 'Continuous autofocus on.');
  refresh();
}

/* ---------- gray card ---------- */
const sCan = document.createElement('canvas'), sCtx = sCan.getContext('2d', {willReadFrequently:true});
function sampleGray(nx, ny){
  const src = editSrc || video, [w,h] = srcSize();
  const r = Math.max(6, Math.round(Math.min(w,h)*0.025));
  const sx = Math.max(0, Math.min(w-2*r, Math.round(nx*w)-r)), sy = Math.max(0, Math.min(h-2*r, Math.round(ny*h)-r));
  const n = Math.min(48, 2*r);
  sCan.width = sCan.height = n;
  sCtx.drawImage(src, sx, sy, 2*r, 2*r, 0, 0, n, n);
  const d = sCtx.getImageData(0,0,n,n).data;
  let R=0,G=0,B=0,c=0,clip=0;
  for (let i=0;i<d.length;i+=4){
    if (d[i]>250||d[i+1]>250||d[i+2]>250){ clip++; continue; }
    R+=lin(d[i]/255); G+=lin(d[i+1]/255); B+=lin(d[i+2]/255); c++;
  }
  if (c < n*n*0.3) return {err:'That spot is blown out. Lower the brightness or move the light, then tap the card again.'};
  R/=c; G/=c; B/=c;
  const m = Math.max(R,G,B), mn = Math.min(R,G,B);
  if (m < 0.01) return {err:'That spot is too dark to read. Tap the gray card itself.'};
  if ((m-mn)/m > 0.88) return {err:"That doesn't look like a gray card (too colorful). Tap the middle of the card."};
  const avg = (R+G+B)/3;
  return {gains:[avg/R, avg/G, avg/B], sw:[d[0],d[1],d[2]]};
}
async function grayTap(nx, ny, cx, cy){
  showReticle(cx, cy, true);
  // On phones that allow it, lock the camera's own WB first so the card reading stays valid shot to shot.
  if (!editSrc && hwWB && !S.kelvin){
    const st = track.getSettings ? track.getSettings() : {};
    if (st.colorTemperature) { await setKelvin(Math.round(st.colorTemperature/50)*50); await new Promise(r => setTimeout(r, 350)); }
  }
  const prevKelvin = S.kelvin;
  const res = sampleGray(nx, ny);
  if (res.err){ toast(res.err); return; }
  S.gray = res.gains; S.graySw = res.sw;
  if (!hwWB || editSrc) S.kelvin = null;   // card now sets color; the dial becomes a fine-tune from here
  else S.kelvin = prevKelvin;
  save(); setPick(false); refresh();
  toast('Gray card set. Every shot gets this correction until you clear it.');
}
let picking = false;
function setPick(on){ picking = on; $('pickHint').classList.toggle('show', on); $('grayPick').classList.toggle('on', on); }

/* ---------- stage taps ---------- */
stage.addEventListener('click', e => {
  if ($('start').style.display !== 'none') return;
  const r = view.getBoundingClientRect();
  const nx = (e.clientX - r.left)/r.width, ny = (e.clientY - r.top)/r.height;
  if (nx<0||nx>1||ny<0||ny>1) return;
  const sr = stage.getBoundingClientRect(), cx = e.clientX - sr.left, cy = e.clientY - sr.top;
  if (picking) grayTap(nx, ny, cx, cy); else focusAt(nx, ny, cx, cy);
});
let retT;
function showReticle(x, y, gray){
  const el = $('reticle'); el.className = gray ? 'gray' : '';
  el.style.left = x+'px'; el.style.top = y+'px';
  void el.offsetWidth; el.classList.add('show');
  clearTimeout(retT); retT = setTimeout(() => el.classList.remove('show'), 1200);
}
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3600); }

/* ---------- dials ---------- */
const WB = {min:2500, max:9000, step:50, px:7};
function makeDial(el, cfg){
  const c = el.querySelector('canvas'), ctx = c.getContext('2d');
  function paint(){
    const dpr = devicePixelRatio || 1, W = el.clientWidth, H = el.clientHeight;
    if (!W) return;
    c.width = W*dpr; c.height = H*dpr; c.style.width = W+'px'; c.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const v = cfg.get(), center = W/2;
    const first = Math.ceil((v - (center/cfg.px)*cfg.step - cfg.min)/cfg.step);
    const last = Math.floor((v + (center/cfg.px)*cfg.step - cfg.min)/cfg.step);
    ctx.font = '600 10px -apple-system,system-ui,sans-serif'; ctx.textAlign = 'center';
    for (let i = Math.max(0, first); i <= last; i++){
      const val = cfg.min + i*cfg.step; if (val > cfg.max + 1e-6) break;
      const x = center + (val - v)/cfg.step*cfg.px, major = i % cfg.major === 0;
      ctx.fillStyle = major ? '#A0A0A8' : '#4A4A52';
      ctx.fillRect(Math.round(x), major ? 6 : 12, 1, major ? 16 : 8);
      if (major){ ctx.fillStyle = '#6E6E78'; ctx.fillText(cfg.label(val), x, H-8); }
    }
  }
  let sx = 0, sv = 0, drag = false;
  el.addEventListener('pointerdown', e => { drag = true; sx = e.clientX; sv = cfg.get(); el.setPointerCapture(e.pointerId); cfg.begin && cfg.begin(); });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    let v = sv - (e.clientX - sx)/cfg.px*cfg.step;
    v = Math.round(v/cfg.step)*cfg.step; v = Math.min(cfg.max, Math.max(cfg.min, +v.toFixed(2)));
    if (v !== cfg.get()){ cfg.set(v); paint(); }
  });
  const end = () => { if (drag){ drag = false; cfg.end && cfg.end(); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  return paint;
}
let wbLive = 5500, wbTimer = null;
const paintWB = makeDial($('dWB'), {
  get min(){ return WB.min; }, get max(){ return WB.max; }, step:WB.step, px:WB.px, major:10,
  label: v => (v/1000).toFixed(1)+'K',
  get: () => S.kelvin || wbLive,
  set: v => {
    S.kelvin = v; refresh(false);
    clearTimeout(wbTimer); wbTimer = setTimeout(() => setKelvin(v), hwWB ? 60 : 0);
  },
  end: () => setKelvin(S.kelvin)
});
const paintEV = makeDial($('dEV'), {
  min:-2, max:2, step:0.1, px:12, major:10,
  label: v => (v>0?'+':'')+v.toFixed(0),
  get: () => S.ev, set: v => { S.ev = v; refresh(false); }, end: save
});
const presets = [['Tungsten',3200],['Warm LED',3500],['Neutral LED',4500],['Daylight',5500],['Flash',5800],['Cloudy',6500],['Shade',7500]];
presets.forEach(([n,k]) => { const b = document.createElement('button'); b.textContent = `${n} ${k}`; b.onclick = () => { setKelvin(k); paintWB(); }; $('wbPresets').appendChild(b); });

/* ---------- panels ---------- */
let panel = null;
function openPanel(p){
  panel = panel === p ? null : p;
  ['WB','EV','Gray'].forEach(k => { $('p'+k).hidden = panel !== k; $('c'+k).classList.toggle('sel', panel === k); });
  if (panel === 'WB') paintWB();
  if (panel === 'EV') paintEV();
  if (panel === 'Gray' && !S.gray) setPick(true);
  if (panel !== 'Gray') setPick(false);
  setTimeout(layout, 0);
}
$('cWB').onclick = () => openPanel('WB');
$('cEV').onclick = () => openPanel('EV');
$('cGray').onclick = () => openPanel('Gray');
$('cAF').onclick = toggleAFLock;
$('wbAuto').onclick = () => { setKelvin(null); paintWB(); };
$('evZero').onclick = () => { S.ev = 0; save(); refresh(); paintEV(); };
$('grayPick').onclick = () => setPick(!picking);
$('grayClear').onclick = () => { S.gray = null; S.graySw = null; save(); setPick(false); refresh(); };
$('bGrid').onclick = () => { S.grid = !S.grid; save(); refresh(); };
$('bCrop').onclick = () => { S.crop = S.crop === '1:1' ? '4:3' : '1:1'; save(); refresh(); layout(); };

function refresh(persist){
  if (persist !== false) save();
  const sw = !hwWB || editSrc;
  $('vWB').textContent = S.kelvin ? S.kelvin+'K' : (S.gray ? 'CARD' : 'AUTO');
  $('cWB').classList.toggle('active', !!S.kelvin);
  $('wbVal').textContent = S.kelvin ? S.kelvin+'K' : 'AUTO';
  $('wbHow').textContent = S.gray ? '(fine-tune on top of the card)' : (sw ? '' : '(camera hardware)');
  $('vGray').textContent = S.gray ? 'SET' : 'OFF';
  $('cGray').classList.toggle('set', !!S.gray);
  $('graySw').style.background = S.graySw ? `rgb(${S.graySw.join(',')})` : 'transparent';
  $('grayTxt').textContent = S.gray
    ? 'Card is set and applied to every shot. Re-tap the card if your lighting changes.'
    : "Put a gray card in the light you're shooting in, then tap it on screen.";
  $('vEV').textContent = (S.ev>0?'+':'') + S.ev.toFixed(1);
  $('cEV').classList.toggle('active', S.ev !== 0);
  $('evVal').textContent = (S.ev>0?'+':'') + S.ev.toFixed(1);
  $('vAF').textContent = afLocked ? 'LOCKED' : 'AUTO';
  $('cAF').classList.toggle('active', afLocked);
  $('bGrid').classList.toggle('on', S.grid); $('grid').classList.toggle('show', S.grid);
  $('bCrop').textContent = S.crop; $('bCrop').classList.toggle('on', S.crop === '1:1');
  $('modeTag').textContent = editSrc ? 'photo fix' : (stream ? (hwWB ? 'hardware WB' : 'color by app') : '');
  $('shutter').classList.toggle('save', !!editSrc);
  $('bEdit').style.display = editSrc ? 'none' : ''; $('bDone').style.display = editSrc ? '' : 'none';
  texDirty = true;
}

/* ---------- capture & gallery ---------- */
const shots = [];
const out = document.createElement('canvas'), octx = out.getContext('2d');
let shotN = 0;
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
async function capture(){
  if (!editSrc && (!stream || video.readyState < 2)) return;
  if (!draw(true)) return;
  const w = view.width, h = view.height, c = cropRect(w, h);
  out.width = Math.round(c.w); out.height = Math.round(c.h);
  octx.drawImage(view, c.x, c.y, c.w, c.h, 0, 0, out.width, out.height);
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = .8; void f.offsetWidth; f.style.transition = ''; f.style.opacity = 0;
  const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', 0.92));
  shotN++;
  shots.push({blob, url:URL.createObjectURL(blob), name:`listing_${stamp()}_${shotN}.jpg`});
  updThumb();
  if (editSrc){ toast('Fixed photo added. Tap the thumbnail to save.'); exitEdit(); }
}
function updThumb(){
  const t = $('thumb'), last = shots[shots.length-1];
  t.style.backgroundImage = last ? `url(${last.url})` : '';
  $('thumbN').textContent = shots.length; $('thumbN').style.display = shots.length ? 'grid' : 'none';
}
$('shutter').onclick = capture;
document.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter' || e.key === 'AudioVolumeUp') { e.preventDefault(); capture(); } });

async function shareFiles(list){
  const files = list.map(s => new File([s.blob], s.name, {type:'image/jpeg'}));
  if (navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); return true; }catch(e){ return e.name === 'AbortError' ? false : download(list); }
  }
  return download(list);
}
function download(list){
  list.forEach((s,i) => setTimeout(() => { const a = document.createElement('a'); a.href = s.url; a.download = s.name; document.body.appendChild(a); a.click(); a.remove(); }, i*250));
  return true;
}
function openSheet(){
  const g = $('gal'); g.innerHTML = '';
  if (!shots.length) g.innerHTML = '<div class="empty" style="grid-column:1/-1">No photos yet.</div>';
  shots.forEach(s => { const b = document.createElement('button'); b.style.backgroundImage = `url(${s.url})`; b.onclick = () => shareFiles([s]); g.appendChild(b); });
  $('galTitle').textContent = shots.length ? `${shots.length} photo${shots.length>1?'s':''}` : 'Photos';
  $('galSave').textContent = shots.length > 1 ? `Save all ${shots.length}` : 'Save';
  $('sheet').hidden = false;
}
$('thumb').onclick = openSheet;
$('galClose').onclick = () => $('sheet').hidden = true;
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').hidden = true; };
$('galSave').onclick = () => shots.length && shareFiles(shots);
$('galClear').onclick = () => {
  if (!shots.length || !confirm('Clear these photos from the app? Save them first if you need them.')) return;
  shots.splice(0).forEach(s => URL.revokeObjectURL(s.url)); updThumb(); openSheet();
};

/* ---------- fix an existing photo (e.g. one from Pro Camera) ---------- */
$('bEdit').onclick = () => $('file').click();
$('bDone').onclick = exitEdit;
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const lim = Math.min(MAXTEX, 6000), s = Math.min(1, lim/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);   // drawImage honors photo rotation
    URL.revokeObjectURL(url);
    editSrc = c; texDirty = true; $('start').style.display = 'none';
    refresh(); layout();
    toast('Tap Gray Card then the card in this photo, or use the Kelvin dial. Orange button saves.');
  };
  img.onerror = () => toast("Couldn't open that photo.");
  img.src = url;
};
function exitEdit(){
  editSrc = null; texDirty = true;
  if (!stream) $('start').style.display = '';
  refresh(); layout();
}

/* ---------- go ---------- */
$('bStart').onclick = startCam;
refresh(); layout(); requestAnimationFrame(loop);
if (navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:'camera'}).then(p => { if (p.state === 'granted') startCam(); }).catch(()=>{});
}
})();
</script>
