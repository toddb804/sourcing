<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listing Cam">
<meta name="theme-color" content="#000000">
<title>Listing Cam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#000; --panel:#0E0E10; --card:#17171A; --card2:#1E1E22; --line:#2A2A30;
  --text:#F2F2F3; --muted:#A0A0A8; --faint:#6E6E78;
  --orange:#CC5500; --orange-hi:#E2670F; --good:#4CC38A; --warn:#F5B14C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.num{font-variant-numeric:tabular-nums}
:root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
:root.rot90{--sat:env(safe-area-inset-left);--sab:env(safe-area-inset-right)}
:root.rot270{--sat:env(safe-area-inset-right);--sab:env(safe-area-inset-left)}
/* the app always lays out upright relative to the phone; JS sizes it and counter-rotates it if iOS turns the page */
#app{position:fixed;left:0;top:0;width:100vw;height:100dvh;display:flex;flex-direction:column;transform-origin:0 0;background:var(--bg)}
.topsafe{height:var(--sat);flex:none}

/* stage */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;touch-action:none}
#view{position:absolute;left:0;top:0}
#overlay{position:absolute;pointer-events:none}
#grid{position:absolute;inset:0;display:none;
  background:
    linear-gradient(to right,transparent calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% + .5px),transparent calc(33.333% + .5px),
      transparent calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% + .5px),transparent calc(66.666% + .5px)),
    linear-gradient(to bottom,transparent calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% - .5px),rgba(255,255,255,.35) calc(33.333% + .5px),transparent calc(33.333% + .5px),
      transparent calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% - .5px),rgba(255,255,255,.35) calc(66.666% + .5px),transparent calc(66.666% + .5px))}
#grid.show{display:block}
#gridBox{position:absolute}
.mask{position:absolute;background:rgba(0,0,0,.6)}
#reticle{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:1.5px solid var(--orange-hi);border-radius:6px;
  opacity:0;transform:scale(1.25);transition:opacity .2s,transform .2s;pointer-events:none}
#reticle.show{opacity:1;transform:scale(1)}
#anchor{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px dashed var(--good);border-radius:50%;display:none}
#anchor.show{display:block}
#anchor.bad{border-color:var(--warn);border-style:solid}
#reticle.gray{border-radius:50%;border-color:#fff;width:44px;height:44px;margin:-22px 0 0 -22px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#toast{position:absolute;left:16px;right:16px;bottom:14px;margin:auto;max-width:440px;background:rgba(14,14,16,.92);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.35;color:var(--text);opacity:0;transform:translateY(8px);
  transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:none}
#pickHint{position:absolute;top:12px;left:0;right:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--orange);color:#fff;
  font-weight:700;font-size:14px;border-radius:99px;padding:8px 16px;display:none;pointer-events:none}
#pickHint.show{display:block}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#start h1{margin:0;font-size:26px;font-weight:800}
#start p{margin:0;color:var(--muted);max-width:320px;line-height:1.4}
.btn{height:48px;padding:0 22px;border-radius:14px;background:var(--orange);color:#fff;font-weight:800;font-size:16px}
.btn.ghost{background:var(--card);color:var(--text)}

/* controls: everything within thumb reach, fixed height so the preview never moves */
.controls{flex:none;background:var(--panel);padding:8px 14px calc(var(--sab) + 8px)}
.slot{position:relative;height:128px}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.panel[hidden]{display:none}
#pNone{justify-content:center;align-items:center;text-align:center;padding:0 8px}
#status{margin:0;font-size:14px;line-height:1.4;color:var(--muted)}
#status b{color:var(--text)}
.phead{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.phead b{color:var(--text);font-size:22px;font-weight:800}
.sbtn{height:40px;min-width:64px;padding:0 14px;border-radius:12px;background:var(--card);font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.sbtn.on{color:var(--orange-hi);background:rgba(204,85,0,.16)}
.dial{position:relative;height:54px;flex:none;border-radius:14px;background:var(--card);overflow:hidden;touch-action:none;cursor:ew-resize}
.dial .ticks{position:absolute;inset:0}
.dial .needle{position:absolute;left:50%;top:5px;bottom:5px;width:3px;margin-left:-1.5px;background:var(--orange-hi);border-radius:2px}
.dial .fade{position:absolute;inset:0;background:linear-gradient(to right,var(--card),transparent 22%,transparent 78%,var(--card));pointer-events:none}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;height:34px;padding:0 12px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:700;color:var(--muted)}
.gray-row{display:flex;gap:10px;align-items:center}
.gray-row p{flex:1;margin:0;font-size:14px;color:var(--muted);line-height:1.35}
.gray-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gray-btns .sbtn{height:48px}
.swatch{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);flex:none}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{height:58px;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700}
.opt small{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--faint)}
.opt.on{color:var(--orange-hi);background:rgba(204,85,0,.16)}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.ctl{height:58px;background:var(--card);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent}
.ctl small{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--faint)}
.ctl b{font-size:16px;font-weight:800}
.ctl.sel{border-color:var(--orange)}
.ctl.active b{color:var(--orange-hi)}
.ctl.set b{color:var(--good)}
.ctl.warn b{color:var(--warn)}

.shutter-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:0 6px}
.shutter-row.lefty{flex-direction:row-reverse}
#thumb{width:60px;height:60px;border-radius:12px;background:var(--card) center/cover no-repeat;border:2px solid var(--line);position:relative}
#thumb .n{position:absolute;right:-7px;top:-7px;min-width:22px;height:22px;border-radius:99px;background:var(--orange);color:#fff;font-size:12px;font-weight:800;display:none;place-items:center;padding:0 5px}
#shutter{width:84px;height:84px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
#shutter i{width:66px;height:66px;border-radius:50%;background:#fff;transition:transform .1s}
#shutter:active i{transform:scale(.9)}
#shutter.save i{background:var(--orange)}
.sq{width:60px;height:60px;border-radius:12px;background:var(--card);font-size:13px;font-weight:700;color:var(--muted);display:grid;place-items:center;text-align:center;line-height:1.15}
.sq.sel{color:var(--orange-hi);background:rgba(204,85,0,.16)}

/* gallery sheet */
.pill{height:40px;padding:0 16px;white-space:nowrap;border-radius:99px;background:var(--card);color:var(--text);font-size:14px;font-weight:700}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:10}
#sheet[hidden]{display:none}
.sheet-in{width:100%;max-height:85%;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(var(--sab) + 14px);display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head b{font-size:18px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow-y:auto;min-height:0}
.gal button{aspect-ratio:1;background:var(--card) center/cover no-repeat;border-radius:8px;position:relative}
.gal button.unsaved::after{content:'Not saved';position:absolute;left:4px;bottom:4px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.sheet-actions .btn{flex:1;height:54px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="topsafe"></div>

  <div id="stage">
    <canvas id="view"></canvas>
    <div id="overlay"><div id="gridBox"><div id="grid"></div></div><div class="mask" id="m1"></div><div class="mask" id="m2"></div><div id="anchor"></div></div>
    <div id="reticle"></div>
    <div id="flash"></div>
    <div id="pickHint">Tap the gray card</div>
    <div id="toast"></div>
    <div id="start">
      <h1>Listing Cam</h1>
      <p>Autofocus, a Kelvin dial and gray-card color for consistent listing photos.</p>
      <button class="btn" id="bStart">Start camera</button>
      <p id="startErr" style="color:var(--warn)"></p>
    </div>
  </div>

  <div class="controls">
    <div class="slot">
      <div class="panel" id="pNone"><p id="status"></p></div>

      <div class="panel" id="pWB" hidden>
        <div class="phead"><span>Kelvin <span id="wbHow"></span></span><b id="wbVal" class="num">AUTO</b><button class="sbtn" id="wbAuto">Auto</button></div>
        <div class="dial" id="dWB"><canvas class="ticks"></canvas><i class="fade"></i><i class="needle"></i></div>
        <div class="presets" id="wbPresets"></div>
      </div>

      <div class="panel" id="pEV" hidden>
        <div class="phead"><span>Brightness (stops)</span><b id="evVal" class="num">0.0</b><button class="sbtn" id="evZero">Reset</button></div>
        <div class="dial" id="dEV"><canvas class="ticks"></canvas><i class="fade"></i><i class="needle"></i></div>
      </div>

      <div class="panel" id="pGray" hidden>
        <div class="gray-row"><div class="swatch" id="graySw"></div><p id="grayTxt"></p></div>
        <div class="gray-btns"><button class="sbtn" id="grayPick">Tap card</button><button class="sbtn" id="grayClear">Clear</button></div>
      </div>

      <div class="panel" id="pMore" hidden>
        <div class="opts">
          <button class="opt" id="bGrid"><small>GRID</small><span id="vGrid">On</span></button>
          <button class="opt" id="bCrop"><small>SHAPE</small><span id="vCrop">3:4</span></button>
          <button class="opt" id="bAuto"><small>AUTO-SAVE</small><span id="vAuto">On</span></button>
          <button class="opt" id="bAF"><small>FOCUS</small><span id="vAF">Auto</span></button>
          <button class="opt" id="bEdit"><small>FIX A</small><span>Photo</span></button>
          <button class="opt" id="bHand"><small>HAND</small><span id="vHand">Right</span></button>
        </div>
      </div>
    </div>

    <div class="chips">
      <button class="ctl" id="cWB"><small>WHITE BAL</small><b id="vWB" class="num">AUTO</b></button>
      <button class="ctl" id="cGray"><small>GRAY CARD</small><b id="vGray">OFF</b></button>
      <button class="ctl" id="cEV"><small>BRIGHT</small><b id="vEV" class="num">0.0</b></button>
      <button class="ctl" id="cLock"><small>LOCK</small><b id="vLock">OFF</b></button>
    </div>

    <div class="shutter-row" id="srow">
      <button id="thumb" aria-label="Photos"><span class="n" id="thumbN"></span></button>
      <button id="shutter" aria-label="Take photo"><i></i></button>
      <button class="sq" id="bMore">More</button>
      <button class="sq" id="bDone" style="display:none">Back to<br>camera</button>
    </div>
  </div>

  <div id="sheet" hidden>
    <div class="sheet-in">
      <div class="sheet-head"><b id="galTitle">Photos</b><button class="pill" id="galClose">Close</button></div>
      <div class="gal" id="gal"></div>
      <div class="sheet-actions">
        <button class="btn ghost" id="galClear">Clear</button>
        <button class="btn" id="galSave">Save all</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<video id="video" playsinline muted autoplay style="display:none"></video>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const video = $('video'), view = $('view'), stage = $('stage');

/* ---------- settings (remembered on this phone) ---------- */
const S = Object.assign({kelvin:null, gray:null, graySw:null, ev:0, grid:true, crop:'1:1', autosave:true, lefty:false}, (()=>{
  try{ return JSON.parse(localStorage.getItem('listingcam') || '{}'); }catch(e){ return {}; }
})());
if (S.crop === '4:3') S.crop = '3:4';
if ((S.v || 0) < 2){ S.crop = '1:1'; S.v = 2; }
function save(){ try{ localStorage.setItem('listingcam', JSON.stringify(S)); }catch(e){} }

/* ---------- color math (all in linear light) ---------- */
const lin = c => c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
function kelvinRGB(k){            // color of a light source at k Kelvin, linear RGB
  const t = k/100; let r,g,b;
  if (t <= 66){ r = 255; g = 99.4708025861*Math.log(t) - 161.1195681661; }
  else { r = 329.698727446*Math.pow(t-60,-0.1332047592); g = 288.1221695283*Math.pow(t-60,-0.0755148492); }
  if (t >= 66) b = 255; else if (t <= 19) b = 0; else b = 138.5177312231*Math.log(t-10) - 305.0447927307;
  return [r,g,b].map(v => lin(Math.min(255, Math.max(1, v))/255));
}
const REF = kelvinRGB(5500);
// Same meaning as a camera's WB setting: lower K = bluer picture, higher K = warmer.
const kelvinGains = k => { const c = kelvinRGB(k); return [REF[0]/c[0], REF[1]/c[1], REF[2]/c[2]]; };
const normLum = g => { const L = .2126*g[0] + .7152*g[1] + .0722*g[2]; return g.map(v => v/L); };

/* ---------- camera state ---------- */
let stream = null, track = null, caps = {};
let hwWB = false, hwPOI = false, hwFocusModes = [], afLocked = false;
let editSrc = null;                 // canvas holding a photo being fixed
let texDirty = true;
let lock = null;                    // {nx, ny, ref:[r,g,b], drift:[r,g,b], ok} background spot that holds brightness + color steady
const TARGET_GRAY = 0.18;           // middle gray, linear (sRGB 118)

function currentGains(){
  let g = [1,1,1];
  if (S.gray) g = g.map((v,i) => v*S.gray[i]);
  if (S.kelvin && !(hwWB && !editSrc)) { const k = kelvinGains(S.kelvin); g = g.map((v,i) => v*k[i]); }
  g = normLum(g);
  const f = Math.pow(2, S.ev) * (S.gray ? (S.grayExp || 1) : 1);
  if (lock && !editSrc) g = g.map((v,i) => v*lock.drift[i]);
  return g.map(v => v*f);
}

/* ---------- WebGL renderer ---------- */
const gl = view.getContext('webgl', {preserveDrawingBuffer:true, alpha:false, antialias:false}) ||
           view.getContext('experimental-webgl', {preserveDrawingBuffer:true});
const MAXTEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision > 0 ? 'highp' : 'mediump';
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER,
  'attribute vec2 p;uniform mat2 R;uniform vec2 K;varying vec2 uv;void main(){vec2 q=(R*p)*K;uv=vec2(q.x*.5+.5,.5-q.y*.5);gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision ${hp} float;
  uniform sampler2D t; uniform vec3 g; varying vec2 uv;
  vec3 toLin(vec3 c){return mix(c/12.92,pow((c+.055)/1.055,vec3(2.4)),step(.04045,c));}
  vec3 toS(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
  void main(){vec3 c=toLin(texture2D(t,uv).rgb)*g;
    float m=max(c.r,max(c.g,c.b)); if(m>1.){c=mix(c,vec3(1.),clamp((m-1.)*1.5,0.,1.));}  // roll clipped highlights to white, not a tint
    gl_FragColor=vec4(toS(clamp(c,0.,1.)),1.);}`));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
const uG = gl.getUniformLocation(prog,'g'), uR = gl.getUniformLocation(prog,'R'), uK = gl.getUniformLocation(prog,'K');
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
[gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(p => gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE));
[gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(p => gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR));

function srcSize(){ return editSrc ? [editSrc.width, editSrc.height] : [video.videoWidth, video.videoHeight]; }
/* Photos are always vertical, as if the phone were upright.
   If iOS hands over a sideways frame (page rotated), turn it back; anything still wider than 3:4 is cropped to 3:4. */
function screenAngle(){
  if (typeof window.orientation === 'number') return (window.orientation + 360) % 360;   // iOS
  return (screen.orientation && screen.orientation.angle) || 0;
}
const ROT = {0:[1,0,0,1], 90:[0,1,-1,0], 270:[0,-1,1,0]};   // column-major mat2: output -> source
let geo = {rot:0, ow:0, oh:0, k:[1,1]};
function geometry(){
  const [w,h] = srcSize();
  let rot = 0;
  if (!editSrc && w > h){ const a = screenAngle(); if (a === 90 || a === 270) rot = a; }
  let ow = rot ? h : w, oh = rot ? w : h, k = [1,1];
  if (ow > oh*0.75 + 1){ const nw = Math.round(oh*0.75); const f = nw/ow; ow = nw; k = rot ? [1,f] : [f,1]; }
  return {rot, ow, oh, k};
}
function outToSrc(nx, ny){            // normalized output point -> normalized source point
  const m = ROT[geo.rot], px = 2*nx - 1, py = 1 - 2*ny;
  const qx = (m[0]*px + m[2]*py)*geo.k[0], qy = (m[1]*px + m[3]*py)*geo.k[1];
  return [(qx + 1)/2, (1 - qy)/2];
}
function draw(upload){
  const src = editSrc || video, [w,h] = srcSize();
  if (!w || !h) return false;
  geo = geometry();
  if (view.width !== geo.ow || view.height !== geo.oh){ view.width = geo.ow; view.height = geo.oh; layout(); }
  if (upload) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
  gl.viewport(0,0,geo.ow,geo.oh);
  gl.uniformMatrix2fv(uR, false, ROT[geo.rot]); gl.uniform2fv(uK, geo.k);
  gl.uniform3fv(uG, currentGains());
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  return true;
}
let frameN = 0;
function loop(){
  if (editSrc){ draw(texDirty); texDirty = false; }
  else if (video.readyState >= 2){
    if (lock && (++frameN % 3 === 0)) updateLock(0.3);
    draw(true);
  }
  requestAnimationFrame(loop);
}

/* fit the canvas inside the stage and place overlays on the picture area */
let disp = {x:0,y:0,w:0,h:0};
function layout(){
  const sw = stage.clientWidth, sh2 = stage.clientHeight, [w,h] = [view.width, view.height];
  if (!w || !h) return;
  const s = Math.min(sw/w, sh2/h), dw = w*s, dh = h*s;
  disp = {x:(sw-dw)/2, y:(sh2-dh)/2, w:dw, h:dh};
  Object.assign(view.style, {left:disp.x+'px', top:disp.y+'px', width:dw+'px', height:dh+'px'});
  const ov = $('overlay'); Object.assign(ov.style, {left:disp.x+'px', top:disp.y+'px', width:dw+'px', height:dh+'px'});
  const c = cropRect(dw, dh), gb = $('gridBox');
  Object.assign(gb.style, {left:c.x+'px', top:c.y+'px', width:c.w+'px', height:c.h+'px'});
  const m1 = $('m1'), m2 = $('m2');

function markSaved(list){ list.forEach(s => s.saved = true); updThumb(); if (!$('sheet').hidden) openSheet(); }
function download(list){
  list.forEach((s,i) => setTimeout(() => { const a = document.createElement('a'); a.href = s.url; a.download = s.name; document.body.appendChild(a); a.click(); a.remove(); }, i*250));
  return true;
}
function openSheet(){
  const g = $('gal'); g.innerHTML = '';
  if (!shots.length) g.innerHTML = '<div class="empty" style="grid-column:1/-1">No photos yet.</div>';
  shots.forEach(s => { const b = document.createElement('button'); b.style.backgroundImage = `url(${s.url})`; if (!s.saved) b.classList.add('unsaved'); b.onclick = () => shareFiles([s]); g.appendChild(b); });
  $('galTitle').textContent = shots.length ? `${shots.length} photo${shots.length>1?'s':''}` : 'Photos';
  const un = shots.filter(s => !s.saved).length;
  $('galSave').textContent = un ? `Save ${un} unsaved` : (shots.length > 1 ? `Save all ${shots.length} again` : 'Save again');
  $('sheet').hidden = false;
}
$('thumb').onclick = openSheet;
$('galClose').onclick = () => $('sheet').hidden = true;
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').hidden = true; };
$('galSave').onclick = () => { const u = shots.filter(s => !s.saved); shareFiles(u.length ? u : shots); };
$('galClear').onclick = () => {
  if (!shots.length) return;
  if (shots.some(s => !s.saved) && !confirm('Some photos are not saved to your Photos yet. Clear anyway?')) return;
  shots.splice(0).forEach(s => URL.revokeObjectURL(s.url)); updThumb(); openSheet();
};

/* ---------- fix an existing photo (e.g. one from Pro Camera) ---------- */
$('bEdit').onclick = () => { openPanel(null); $('file').click(); };
$('bDone').onclick = exitEdit;
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const lim = Math.min(MAXTEX, 6000), s = Math.min(1, lim/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);   // drawImage honors photo rotation
    URL.revokeObjectURL(url);
    editSrc = c; texDirty = true; $('start').style.display = 'none'; placeAnchor(); if (picking === 'anchor') setPick(null);
    refresh(); layout();
    toast('Tap Gray Card then the card in this photo, or use the Kelvin dial. Orange button saves.');
  };
  img.onerror = () => toast("Couldn't open that photo.");
  img.src = url;
};
function exitEdit(){
  editSrc = null; texDirty = true; placeAnchor();
  if (!stream) $('start').style.display = '';
  refresh(); layout();
}

/* ---------- go ---------- */
$('bStart').onclick = startCam;
orientUI(); refresh(); layout(); requestAnimationFrame(loop);
if (navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:'camera'}).then(p => { if (p.state === 'granted') startCam(); }).catch(()=>{});
}
})();
</script>
